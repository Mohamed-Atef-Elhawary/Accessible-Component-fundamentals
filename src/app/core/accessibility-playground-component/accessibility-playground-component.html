<section class="bg-white h-full p-2">
  <h2 class="text-2xl font-semibold mb-6 xl:mb-8">Accessibility Playground</h2>
  <ul class="flex flex-col gap-3 xl:gap-5">
    @for (option of accessibilityOptions(); track $index) {
      <li>
        <label [for]="option.id" class="flex gap-2 items-center cursor-pointer w-fit">
          <input
            type="checkbox"
            [id]="option.id"
            class="peer sr-only"
            [checked]="option.checked()"
            (change)="toggle(option)"
          />
          <div
            [class]="{
              'peer-focus-visible:outline-none': !option.checked(),
            }"
            class="outline-2 outline-gray-3 peer-checked:outline-indigo-6 w-fit peer-focus-visible:ring-indigo-7 peer-focus-visible:ring-(length:--spacing-focus-visible-length)"
          >
            <fa-icon
              [class]="{
                'opacity-100': option.checked(),
                'opacity-0': !option.checked(),
              }"
              [icon]="check"
            ></fa-icon>
          </div>
          <span class="text-lg">{{ option.label }} </span>
        </label>
      </li>
    }
  </ul>
</section>
