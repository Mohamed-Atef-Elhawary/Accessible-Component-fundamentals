<section class="bg-whiteColor h-full p-2 border-2 border-disbtnporder">
  <h2 class="text-2xl font-semibold mb-6 xl:mb-8">Accessibility Playground</h2>
  <ul class="flex flex-col gap-3 xl:gap-5">
    @for (option of accessibilityOptions(); track $index) {
      <li>
        <label [for]="option.id" class="flex gap-2 items-center text-dark cursor-pointer w-fit">
          <input
            type="checkbox"
            [id]="option.id"
            class="peer sr-only"
            [checked]="option.checked()"
            (change)="toggle(option)"
          />

          <div
            [class]="{
              'peer-focus-visible:outline-0': !option.checked(),
              'peer-focus-visible:ring-2': !option.checked(),
              'peer-focus-visible:ring-4': option.checked(),
            }"
            class="outline-2 outline-disbtnporder peer-checked:outline-btnporder w-fit peer-focus-visible:ring-focusVisibleColor"
          >
            <fa-icon
              [class]="{
                'opacity-100': option.checked(),
                'opacity-0': !option.checked(),
              }"
              [icon]="check"
            ></fa-icon>
          </div>
          <span class="text-lg">{{ option.label }} </span>
        </label>
      </li>
    }
  </ul>
</section>
