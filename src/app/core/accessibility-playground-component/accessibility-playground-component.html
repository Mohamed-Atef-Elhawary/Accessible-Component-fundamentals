<section class="bg-whiteColof p-2 border-2 border-disbtnporder">
  <h2 class="text-2xl font-semibold mb-6 bg-amber-600">Accessibility Playground</h2>
  <ul>
    <li>
      <input type="checkbox" id="backdrop" class="peer sr-only" (click)="print()" />

      <span class="outline-2 outline-disbtnporder peer-checked:outline-btnporder p-1 block w-fit">
        <lucide-icon class="bg-amber-400" [name]="check"></lucide-icon>
      </span>

      <label for="backdrop">
        <span class="bg-amber-700">Close on Beckdrop Click</span>
      </label>
    </li>

    <li>
      <input type="checkbox" id="esc" />
      <label for="esc">Close on ESC</label>
    </li>
    <li>
      <input type="checkbox" id="scroll" />
      <label for="scroll">Look Scroll</label>
    </li>
  </ul>
</section>
