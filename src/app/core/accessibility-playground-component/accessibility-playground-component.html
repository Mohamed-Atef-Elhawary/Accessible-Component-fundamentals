<section class="bg-whiteColor h-full p-2 border-2 border-disbtnporder overflow-hidden">
  <h2 class="text-2xl font-semibold mb-10">Accessibility Playground</h2>
  <ul class="flex flex-col gap-6">
    <li>
      <label for="backdrop" class="flex gap-2 items-center text-dark cursor-pointer w-fit">
        <input
          type="checkbox"
          id="backdrop"
          class="peer sr-only"
          [checked]="backdropAccess()"
          (change)="toggleBackdropAccess()"
        />

        <div class="outline-2 outline-disbtnporder peer-checked:outline-btnporder w-fit">
          <fa-icon
            [class]="{
              'opacity-100': backdropAccess(),
              'opacity-0': !backdropAccess(),
            }"
            [icon]="check"
          ></fa-icon>
        </div>
        <span class="text-lg">Close on Beckdrop Click</span>
      </label>
    </li>

    <li>
      <label for="esc" class="flex gap-2 items-center text-dark cursor-pointer w-fit">
        <input
          type="checkbox"
          id="esc"
          class="peer sr-only"
          [checked]="escAccess()"
          (change)="toggleEscAccess()"
        />
        <div class="outline-2 outline-disbtnporder peer-checked:outline-btnporder w-fit">
          <fa-icon
            [class]="{
              'opacity-0': !escAccess(),
              'opacity-100': escAccess(),
            }"
            [icon]="check"
          ></fa-icon>
        </div>
        <span class="text-lg">Close on ESC</span>
      </label>
    </li>

    <li>
      <label for="scroll" class="flex gap-2 items-center text-dark cursor-pointer w-fit">
        <input
          type="checkbox"
          id="scroll"
          class="peer sr-only"
          [checked]="scrollAccess()"
          (change)="toggleScrollAccess()"
        />
        <div class="outline-2 outline-disbtnporder peer-checked:outline-btnporder fit">
          <fa-icon
            [class]="{
              'opacity-0': !scrollAccess(),
              'opacity-100': scrollAccess(),
            }"
            [icon]="check"
          ></fa-icon>
        </div>
        <span class="text-lg">Look Scroll</span>
      </label>
    </li>
  </ul>
</section>
