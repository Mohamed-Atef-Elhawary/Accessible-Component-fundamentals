<section class="bg-gray-2 border-t-2 border-gray-4 p-2">
  <h2 class="text-2xl font-semibold mb-4">Accessibility Activity Log</h2>
  <ul
    class="bg-sidebarbg p-1 flex flex-col gap-2 border-2 border-gray-4 rounded-lg h-[100px] overflow-y-auto focus-visible:outline-none focus-visible:ring-(length:--spacing-focus-visible-length) focus-visible:ring-indigo-7"
  >
    @for (activity of activityLog(); track activity.id) {
      <li class="flex gap-1">
        <span>[{{ activity.date.toLocaleDateString() }}]</span>
        <span>{{ activity.activity }}</span>
      </li>
    }
  </ul>
</section>
