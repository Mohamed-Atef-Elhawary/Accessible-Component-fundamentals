<article
  [class]="{
    'grid-rows-[auto_1fr]': hasOpenState(),
    'grid-rows-[auto_0fr]': !hasOpenState(),
  }"
  class="grid transition-all duration-custom border-2 border-transparent bg-whiteColor"
>
  <h2 [id]="sectionId">
    <button
      type="button"
      [attr.aria-expanded]="hasOpenState()"
      [attr.aria-controls]="contentId"
      #headerButton
      (click)="toggleState()"
      class="flex gap-2 w-full h-full bg-headerSectionbg p-2 cursor-pointer focus-visible:outline-(length:--focus-focusVisibleSpace) focus-visible:outline-focusVisibleColor"
    >
      <fa-icon [class]="hasOpenState() ? 'block' : 'hidden'" [icon]="chevronDown"></fa-icon>
      <fa-icon [class]="!hasOpenState() ? 'block' : 'hidden'" [icon]="chevronRight"></fa-icon>
      <span>{{ title() }}</span>
    </button>
  </h2>

  <div
    [id]="contentId"
    role="region"
    [attr.aria-labelledby]="sectionId"
    [attr.aria-hidden]="!hasOpenState()"
    [inert]="!hasOpenState()"
    appFocusTrapInExpandedSectionDirective
    [enable]="enableTrapFocus()"
    (close)="focusOnHeader()"
    class="overflow-hidden"
  >
    <div class="p-2">
      <ng-content></ng-content>
    </div>
  </div>
</article>
