<article
  [class]="{
    'grid-rows-[auto_1fr]': openState(),
    'grid-rows-[auto_0fr]': !openState(),
  }"
  class="grid transition-all duration-custom border-2 border-transparent bg-whiteColor"
>
  <h2 [id]="'headerId'" class="">
    <button
      type="button"
      (click)="toggleState()"
      class="flex gap-2 w-full h-full bg-headerSectionbg p-2 cursor-pointer focus-visible:outline-4 focus-visible:outline-focusVisibleColor"
      [attr.aria-expanded]="openState()"
      [attr.aria-controls]="'settingId'"
    >
      <fa-icon [class]="openState() ? 'block' : 'hidden'" [icon]="chevronDown"></fa-icon>
      <fa-icon [class]="!openState() ? 'block' : 'hidden'" [icon]="chevronRight"></fa-icon>
      <span>{{ title() }}</span>
    </button>
  </h2>

  <div
    class="overflow-hidden"
    [id]="'settingId'"
    role="region"
    [attr.aria-labelledby]="'headerId'"
    [attr.aria-hidden]="!openState()"
    [inert]="!openState()"
  >
    <div class="p-2"><ng-content></ng-content></div>
  </div>
</article>
