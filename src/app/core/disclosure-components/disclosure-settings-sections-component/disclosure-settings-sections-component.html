<div class="m-2">
  <app-disclosure-section-component title="Notification preferences">
    <app-toggle-settings-list-component
      [settingList]="notificationSettingList"
    ></app-toggle-settings-list-component>
  </app-disclosure-section-component>

  <app-disclosure-section-component title="Accessibility">
    <app-toggle-settings-list-component
      [settingList]="accessibilitySettingList"
    ></app-toggle-settings-list-component>
  </app-disclosure-section-component>

  <app-disclosure-section-component title="Privacy and security">
    <app-privacy-settings-component />
  </app-disclosure-section-component>

  <app-disclosure-section-component title="Display and appearance">
    <app-display-and-appearance-settings-component />
  </app-disclosure-section-component>
</div>
