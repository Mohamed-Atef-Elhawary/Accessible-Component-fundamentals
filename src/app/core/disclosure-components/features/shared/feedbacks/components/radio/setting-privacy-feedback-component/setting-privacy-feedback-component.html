<div class="flex flex-col gap-2 mt-1">
  <div class="flex gap-2 items-center">
    <span class="text-light text-[.9rem]">Viewing as</span>
    @for (viewerButton of viewersMap; track viewerButton.viewer) {
      <button
        type="button"
        [attr.aria-pressed]="viewerButton.viewer === viewer()"
        (click)="viewerButton.viewSetter()"
        [class.bg-indigo-6/50]="viewerButton.viewer === viewer()"
        class="border border-gray-3 py-1 px-4 rounded text-[1rem] cursor-pointer active:scale-95 focus-visible:outline-none transition duration-custom focus-visible:ring-(length:--spacing-focus-visible-length) focus-visible:ring-indigo-7 capitalize"
      >
        {{ viewerButton.viewer }}
      </button>
    }
  </div>

  <article class="border border-gray-4 p-4 rounded-lg flex flex-col gap-2 h-[14rem] bg-green-1">
    <header class="flex gap-2 items-center">
      <span
        [style.background-color]="bgColor"
        class="p-1.5 rounded-full text-white font-semibold"
        >{{ userInit }}</span
      >
      <div>
        <h4 class="font-semibold text-[1rem]">{{ userName() }}</h4>
        <p class="text-light text-[.9rem]">Member since 2026</p>
      </div>
    </header>

    @if (isAllow()) {
      <div class="flex flex-col justify-between grow">
        <div class="flex flex-col gap-2">
          <h5 class="text-[1rem]">About</h5>
          <span class="block h-[.4rem] w-[80%] bg-gray-3 rounded"></span>
          <span class="block h-[.4rem] w-[50%] bg-gray-3 rounded"></span>
        </div>
        <div class="flex flex-col gap-2">
          <h5 class="text-[.9rem]">Recent activity</h5>
          <span class="block h-[.4rem] w-[70%] bg-gray-3 rounded"></span>
          <span class="block h-[.4rem] w-[40%] bg-gray-3 rounded"></span
          ><span class="block h-[.4rem] w-[60%] bg-gray-3 rounded"></span>
        </div>
      </div>
    } @else {
      <div class="flex flex-col justify-center items-center grow gap-1">
        <fa-icon
          [icon]="lockMetaData().icon"
          aria-hidden="true"
          class="text-[3rem] text-light"
        ></fa-icon>
        <p class="">{{ lockMetaData().message }}</p>
      </div>
    }
  </article>

  <p aria-live="polite" class="text-slate-6">{{ description() }}</p>
</div>
