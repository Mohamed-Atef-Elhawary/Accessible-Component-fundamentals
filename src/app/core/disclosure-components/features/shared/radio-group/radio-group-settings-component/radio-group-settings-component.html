<fieldset class="flex flex-col gap-2">
  <legend class="mb-1">Who can see my profile?</legend>
  @if (previewPosition() === 'top') {
    <ng-container [ngTemplateOutlet]="preview"></ng-container>
  }
  <div class="flex gap-2">
    @for (setting of radioViewData().settings; track setting.settingName) {
      <label
        class="flex-1 flex flex-col justify-center items-center cursor-pointer p-1 border-2 border-inactiveColor has-checked:border-activeColor has-checked:bg-activeColor/50 rounded has-focus-visible:outline-(length:--spacing-focusVisibleLength) has-focus-visible:outline-focusVisibleColor"
      >
        <input
          type="radio"
          [name]="setting.groupName"
          [checked]="setting.checked"
          (change)="settingDataChanged(setting.settingName)"
          class="sr-only peer"
        />
        <fa-icon [icon]="setting.icon" aria-hidden="true"></fa-icon>
        <span class="block">{{ setting.settingName }}</span>
      </label>
    }
  </div>
  @if (previewPosition() === 'bottom') {
    <ng-container [ngTemplateOutlet]="preview"></ng-container>
  }
</fieldset>

<ng-template #preview>
  <div>
    <app-settings-feedback-resolver-component [feedbackData]="radioViewData().feedbackData" />
  </div>
</ng-template>
