<fieldset class="flex flex-col gap-2 min-h-0 overflow-hidden">
  <legend class="mb-1">{{ radioViewData().title }}</legend>
  @if (previewPosition() === 'top') {
    <ng-container [ngTemplateOutlet]="preview"></ng-container>
  }
  <div class="flex gap-2">
    @for (setting of radioViewData().settings; track setting.settingName) {
      <label
        class="relative flex-1 flex flex-col justify-center items-center cursor-pointer p-1 border-2 border-gray-3 has-checked:border-indigo-6 has-checked:bg-indigo-6/50 rounded has-focus-visible:outline-(length:--spacing-focus-visible-length) has-focus-visible:outline-indigo-7"
      >
        <input
          type="radio"
          [name]="setting.groupName"
          [checked]="setting.checked"
          (change)="onSelectedOptionChanged(setting.settingName)"
          class="sr-only peer"
        />
        <fa-icon [icon]="setting.icon" aria-hidden="true"></fa-icon>
        <span class="block">{{ setting.settingName }}</span>
      </label>
    }
  </div>
  @if (previewPosition() === 'bottom') {
    <ng-container [ngTemplateOutlet]="preview"></ng-container>
  }
</fieldset>

<ng-template #preview>
  <app-settings-feedback-resolver-component [feedbackData]="radioViewData().feedbackData" />
</ng-template>
