<ul class="text-dark flex flex-col gap-4">
  @for (setting of positionedSettingMetaData(); track setting.settingName) {
    <li>
      <!-- feedback container -->
      @if (setting.feedbackPosition === 'top') {
        <div class="py-1">
          <ng-container [ngTemplateOutlet]="preview" />
        </div>
      }

      <div class="flex items-center justify-between">
        <p class="text-dark" [id]="setting.settingName + 'label'">{{ setting.label }}</p>

        <div class="flex gap-1 items-center">
          <span aria-hidden="true">{{ setting.checked ? 'on' : 'off' }}</span>
          <button
            type="button"
            role="switch"
            [attr.aria-checked]="setting.checked"
            [attr.aria-labelledby]="setting.settingName + 'label'"
            [attr.aria-describedby]="setting.settingName + 'description'"
            (click)="onSettingToggled(setting.settingName)"
            [class]="{
              'border-activeColor': setting.checked,
              'bg-activeColor': setting.checked,
              'hover:border-secondaryBg': setting.checked,
              'hover:bg-secondaryBg': setting.checked,
              'border-inactiveColor': !setting.checked,
              'bg-whiteColor': !setting.checked,
            }"
            class="group w-[46px] h-[24px] border-2 rounded-full flex items-center px-[2px] cursor-pointer transition-all duration-custom focus-visible:outline-none focus-visible:border-focusVisibleColor focus-visible:ring-1 focus-visible:ring-focusVisibleColor"
          >
            <span
              [class]="{
                'bg-whiteColor': setting.checked,
                'translate-x-[22px]': setting.checked,
              }"
              class="w-[16px] h-[16px] rounded-full bg-light translate-x-[0px] group-hover:w-[18px] group-hover:h-[18px] transition-transform duration-custom"
            ></span>
          </button>
        </div>
      </div>
      <p [id]="setting.settingName + 'description'" class="text-light">{{ setting.description }}</p>
      <!-- feedback container -->
      @if (setting.feedbackPosition === 'bottom') {
        <div class="py-1">
          <ng-container [ngTemplateOutlet]="preview" />
        </div>
      }
    </li>
    <ng-template #preview>
      <app-settings-feedback-resolver-component [feedbackData]="setting.feedbackData" />
    </ng-template>
  }
</ul>
