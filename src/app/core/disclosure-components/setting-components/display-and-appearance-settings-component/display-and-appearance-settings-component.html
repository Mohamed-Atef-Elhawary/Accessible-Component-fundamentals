<div class="text-dark bg-whiteColor">
  <div class="flex items-center justify-between">
    <h3 class="block" id="appearance">Appearance</h3>
    <div
      class="flex bg-mainbg rounded overflow-hidden"
      role="radiogroup"
      aria-labelledby="appearance"
    >
      @for (appearance of appearances; track $index) {
        <div class="p-[2px]">
          <input
            type="radio"
            [id]="appearance.id"
            [name]="appearance.name"
            [value]="appearance.value"
            [checked]="appearance.checked()"
            (change)="onChange()"
            class="sr-only peer"
          />
          <label
            [for]="appearance.id"
            class="block rounded peer-focus-visible:ring-2 peer-focus-visible:ring-focusVisibleColor peer-checked:bg-whiteColor"
          >
            <fa-icon aria-hidden="true" [icon]="appearance.icon"></fa-icon>
          </label>
        </div>
      }
    </div>
  </div>
  <div class="flex items-center justify-between">
    <span class="text-dark" id="CompactMode">Compact mode</span>
    <button
      type="button"
      role="switch"
      [attr.aria-checked]="compactMode()"
      aria-labelledby="CompactMode"
      (click)="toggleCompactMode()"
      [class]="{
        'border-btnporder': compactMode(),
        'border-disbtnporder': !compactMode(),
      }"
      class="w-[20px] h-[12px] border-2 rounded-full flex items-center px-[2px] cursor-pointer transition-all duration-custom focus-visible:outline-none focus-visible:border-focusVisibleColor focus-visible:ring-1 focus-visible:ring-focusVisibleColor"
    >
      <span
        [class]="{
          'bg-btnporder': compactMode(),
          'translate-x-[7px]': compactMode(),
          'bg-disbtnporder': !compactMode(),
          'translate-x-[0px]': !compactMode(),
        }"
        class="w-[5px] h-[5px] rounded-full transition-all duration-custom"
      ></span>
    </button>
  </div>
</div>
