<div class="text-dark bg-whiteColor">
  <div class="flex flex-col gap-1">
    <h3 class="" id="appearance">Appearance</h3>
    <div role="radiogroup" aria-labelledby="appearance" class="flex rounded w-full overflow-hidden">
      @for (appearance of appearanceOptions(); track appearance.value) {
        <!-- <div class="p-[2px] grow bg-amber-500"> -->
        <div class="p-[2px] flex-1">
          <input
            type="radio"
            [id]="appearance.value"
            [name]="appearance.name"
            [value]="appearance.value"
            [checked]="appearance.checked"
            (change)="onChange(appearance.value)"
            [attr.aria-label]="getLabel(appearance.value)"
            class="sr-only peer"
          />
          <label
            [for]="appearance.value"
            class="block rounded flex flex-col gap-1 items-center justify-center p-1 border-2 border-inactiveColor peer-checked:bg-whiteColor peer-checked:border-primary peer-focus-visible:ring-4 peer-focus-visible:ring-focusVisibleColor"
          >
            <fa-icon aria-hidden="true" [icon]="appearance.icon" class=""></fa-icon>
            <!-- <span class="sr-only" >{{getLabel(appearance.value)}}</span> -->
            <span class="">{{ capitalizeTitle(appearance.value) }}</span>
          </label>
        </div>
      }
    </div>
  </div>
</div>
