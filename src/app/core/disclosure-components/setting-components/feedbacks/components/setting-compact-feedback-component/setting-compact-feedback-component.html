<div class="flex flex-col gap-2">
  @for (elements of [1, 2, 3]; track $index) {
    <div class="w-[200px] flex items-center gap-1 bg-whiteColor p-2 borde border-inactiveColor">
      <span class="shrink-0 w-[20px] h-[20px] rounded-full block bg-activeColor opacity-50"></span>

      <div class="flex-1 flex flex-col gap-1">
        <span class="block w-[60%] h-[5px] bg-inactiveColor rounded"></span>
        <span class="block w-[80%] h-[5px] bg-inactiveColor rounded opacity-50"></span>
      </div>
    </div>
  }
</div>
