<div [dir]="direction()">
  <div class="flex flex-col gap-1">
    <div class="flex items-center justify-between">
      <h3 id="language" class="text-dark">{{ settingData().langTitle }}</h3>
      <div
        class="flex bg-mainbg rounded overflow-hidden"
        role="radiogroup"
        aria-labelledby="language"
      >
  
        @for (language of languages; track language.id) {
          <div class="p-[2px] relative">
            <input
              type="radio"
              class="sr-only peer"
              [name]="language.name"
              [id]="language.id"
              [checked]="language.checked()"
              (change)="onChange(language.value)"
            />
            <label
              [for]="language.id"
              class="p-1 block rounded text-light peer-checked:text-black peer-checked:bg-whiteColor peer-focus-visible:ring-2 peer-focus-visible:ring-focusVisibleColor"
              >{{ getLang(language.value) }}</label
            >
          </div>
        }
      </div>
    </div>
    <p class="text-light">{{ settingData().text }}</p>
  </div>
  <div class="flex items-center justify-between">
    <p class="text-dark">{{ settingData().dateTitle }}</p>
    <span>{{ dateFormatter() }}</span>
  </div>
</div>
