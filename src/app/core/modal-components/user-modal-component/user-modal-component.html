<div
  appCloseOnBackdropDirective
  appFocusTrapDirective
  [firstFocusedElement]="firstFocusedElement()!"
  [aria-labelledby]="modalInteraction()"
  role="dialog"
  aria-modal="true"
  class="fixed top-0 bottom-0 left-0 right-0 grid place-items-center bg-black/50"
>
  @if (modalInteraction() === 'delete') {
    <div class="bg-white w-[250px] sm:w-[350px] flex flex-col gap-2 items-center p-6 rounded-2xl">
      <div class="w-full flex flex-col">
        <div class="w-full text-right">
          <button
            type="button"
            (click)="onCancel('(X)')"
            aria-label="close dialog"
            class="cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            <fa-icon
              aria-hidden="true"
              class="text-danger2 hover:text-danger"
              [icon]="xIcon"
            ></fa-icon>
          </button>
        </div>
        <p [id]="modalInteraction()" class="font-bold text-lg">{{ formTitle() }}</p>
      </div>

      <fa-icon
        aria-hidden="true"
        class="text-[50px] sm:text-[80px] text-red-500 text-center"
        [icon]="trash"
      ></fa-icon>
      <p class="text-lg sm:text-2xl font-semibold sm:px-6 text-center">
        Are you sure you want to delete this user?
      </p>
      <div class="w-full flex justify-between sm:justify-center sm:gap-5">
        <button
          #firstFocusedButttonElement
          (click)="onCancel('Cancel')"
          class="text-lg sm:text-xl font-semibold py-1 w-[45%] rounded cursor-pointer border hover:border-btnporder border-disbtnporder transition duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
        >
          Cancel
        </button>
        <button
          (click)="deleteUser()"
          class="bg-danger2 hover:bg-danger text-lg sm:text-xl font-semibold text-white py-1 w-[45%] rounded cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
        >
          Delete
        </button>
      </div>
    </div>
  } @else {
    <div>
      <form
        [formGroup]="userForm"
        (ngSubmit)="onSubmit(userForm)"
        class="bg-white w-[250px] sm:w-[350px] flex flex-col gap-5 p-6 rounded-2xl"
      >
        <div class="w-full flex flex-col">
          <div class="w-full text-right">
            <button
              type="button"
              (click)="onCancel('(X)')"
              aria-label="close dialog"
              class="cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
            >
              <fa-icon
                aria-hidden="true"
                class="text-danger2 hover:text-danger"
                [icon]="xIcon"
              ></fa-icon>
            </button>
          </div>
          <p [id]="modalInteraction()" class="font-bold text-lg">{{ formTitle() }}</p>
        </div>

        <label for="userName" class="w-full flex flex-col gap-1 cursor-pointer">
          <span class="font-semibold">{{ inputsLabel().nameLabel }}</span>
          <input
            id="userName"
            type="text "
            #firstFocusedInputElement
            formControlName="name"
            class="bg-gray-100 outline-2 outline-disbtnporder rounded w-full hover:scale-104 hover:pl-2 transition-all duration-custom p-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          />
          <span class="text-danger">{{ errorMessage.name() }}</span>
        </label>
        <label for="userEmail" class="w-full flex flex-col gap-1 cursor-pointer">
          <span class="font-semibold">{{ inputsLabel().emailLabel }}</span>
          <input
            formControlName="email"
            id="userEmail"
            type="text "
            class="bg-gray-100 outline-2 outline-disbtnporder rounded w-full hover:scale-104 hover:pl-2 transition-all duration-custom p-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          />
          <span class="text-danger">{{ errorMessage.email() }}</span>
        </label>
        <label for="userRole" class="w-full flex flex-col gap-1 cursor-pointer">
          <span class="font-semibold">{{ inputsLabel().roleLabel }}</span>
          <input
            formControlName="role"
            id="userRole"
            type="text "
            class="bg-gray-100 outline-2 outline-disbtnporder rounded w-full hover:scale-104 hover:pl-2 transition-all duration-custom p-1 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          />
          <span class="text-danger">{{ errorMessage.role() }}</span>
        </label>
        <div class="w-full flex justify-between sm:justify-center sm:gap-5">
          <button
            type="button"
            (click)="onCancel('Cancel')"
            class="border-2 text-lg sm:text-xl font-semibold py-1 w-[45%] rounded cursor-pointer border-btnporder hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            Cancel
          </button>
          <button
            [disabled]="userForm.invalid || userForm.pristine || !isUserDataChanged()"
            [class]="{
              'cursor-not-allowed': userForm.invalid || userForm.pristine || !isUserDataChanged(),
              'bg-subHeading': userForm.invalid || userForm.pristine || !isUserDataChanged(),
              'cursor-pointer': userForm.valid && userForm.dirty,
              'bg-secondarybg': userForm.valid && userForm.dirty,
              'hover:scale-102': userForm.valid && userForm.dirty,
            }"
            class="text-lg sm:text-xl font-semibold text-dark py-1 w-[45%] rounded transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            {{ true ? 'Save' : 'Add' }}
          </button>
        </div>
      </form>
    </div>
  }
</div>
