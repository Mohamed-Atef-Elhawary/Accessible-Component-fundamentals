<header class="flex flex-col lg:flex-row gap-y-4 lg:justify-between lg:items-end">
  <section>
    <h1 class="text-3xl text-dark text-bold" tabindex="-1">User Management & Modal Studio</h1>
    <p class="text-xl text-indigo-600">
      Manage system users and test accessible modal dialog interactions.
    </p>
  </section>
  <button
    class="flex items-center gap-1 bg-secondarybg hover:bg-indigo-400 transition duration-200 text-dark text-xl font-medium w-fit px-2 py-1 lg:py-0 rounded-full h-[40px] cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-200"
  >
    <lucide-icon [name]="aiIcon"></lucide-icon>
    <span> Generate Bio </span>

</header>
