<div
  #modalRootElement
  class="fixed top-0 bottom-0 left-0 right-0 grid place-items-center bg-black/50"
>
  @if (modalInteraction() === 'delete') {
    <div class="bg-white w-[250px] sm:w-[350px] flex flex-col gap-2 items-center p-6 rounded-2xl">
      <div class="w-full flex justify-end">
        <button
          (click)="clearModal()"
          class="cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
        >
          <fa-icon class="text-danger2 hove:text-danger" [icon]="xIcon"></fa-icon>
        </button>
      </div>

      <fa-icon class="text-[50px] sm:text-[80px] text-red-500 text-center" [icon]="trash"></fa-icon>
      <p class="text-lg sm:text-2xl font-semibold sm:px-6 text-center">
        Are you sure you want to delete this user?
      </p>
      <div class="w-full flex justify-between sm:justify-center sm:gap-5">
        <button
          (click)="clearModal()"
          class="text-lg sm:text-xl font-semibold py-1 w-[45%] rounded cursor-pointer border hover:border-btnporder border-disbtnporder transition duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
        >
          Cancel
        </button>
        <button
          (click)="deleteUser()"
          class="bg-danger2 hover:bg-danger text-lg sm:text-xl font-semibold text-white py-1 w-[45%] rounded cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
        >
          Delete
        </button>
      </div>
    </div>
  } @else {
    <div>
      <form
        [formGroup]="userForm"
        (ngSubmit)="onSubmit(userForm)"
        class="bg-white w-[250px] sm:w-[350px] flex flex-col gap-5 p-6 rounded-2xl"
      >
        <div class="w-full flex justify-end">
          <button
            type="button"
            (click)="clearModal()"
            class="cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            <fa-icon class="text-danger2 hove:text-danger" [icon]="xIcon"></fa-icon>
          </button>
        </div>
        <div class="flex flex-col gap-1 text-xl">
          <button
            type="button"
            (click)="updateNotEdit('name')"
            class="flex gap-2 items-center font-semibold cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            <fa-icon class="w-5 h-5" [icon]="pencil"></fa-icon>

            <span>Edit user name</span>
          </button>
          <input
            [class]="{
              'h-0': !isEditing.name(),
              'p-1': isEditing.name(),
              'focus-visible:outline-none': isEditing.name(),
              'focus-visible:ring-2': isEditing.name(),
              'focus-visible:ring-focusVisibleColor': isEditing.name(),
            }"
            type="text"
            class="bg-gray-100 outline-0 rounded w-full transition-all duration-custom"
            [placeholder]="$safeNavigationMigration(userData()?.name)"
            formControlName="name"
          />

          <span
            class="text-dark overflow-hidden transition-all duration-custom"
            [class]="{ 'h-[0px]': isEditing.name() }"
            >{{ userData()?.name }}</span
          >
        </div>
        <div class="flex flex-col gap-1 text-xl">
          <button
            type="button"
            (click)="updateNotEdit('email')"
            class="flex gap-2 items-center font-semibold cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            <fa-icon class="w-5 h-5" [icon]="pencil"></fa-icon>

            <span>Edit user email</span>
          </button>
          <input
            type="email"
            [class]="{
              'h-0': !isEditing.email(),
              'p-1': isEditing.email(),
              'focus-visible:outline-none': isEditing.email(),
              'focus-visible:ring-2': isEditing.email(),
              'focus-visible:ring-focusVisibleColor': isEditing.email(),
            }"
            class="bg-gray-100 outline-0 rounded w-full transition-all duration-cusom overflow-hidden"
            [placeholder]="$safeNavigationMigration(userData()?.email)"
            formControlName="email"
          />
          <span
            class="overflow-hidden transition-all duration-custom"
            [class]="{ 'h-0': isEditing.email() }"
            >{{ userData()?.email }}</span
          >
        </div>
        <div class="flex flex-col gap-1 text-xl">
          <button
            type="button"
            (click)="updateNotEdit('role')"
            class="flex gap-2 items-center font-semibold cursor-pointer hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            <fa-icon class="w-5 h-5" [icon]="pencil"></fa-icon>
            <span>Edit user role</span>
          </button>
          <input
            type="text"
            [class]="{
              'h-0': !isEditing.role(),
              'p-1': isEditing.role(),
              'focus-visible:outline-none': isEditing.role(),
              'focus-visible:ring-2': isEditing.role(),
              'focus-visible:ring-focusVisibleColor': isEditing.role(),
            }"
            class="bg-gray-100 outline-0 rounded w-full transition-all duration-custom"
            [placeholder]="$safeNavigationMigration(userData()?.role)"
            formControlName="role"
          />
          <span
            [class]="{ 'h-0': isEditing.role() }"
            class="text-dark overflow-hidden transition-all duration-custom"
          >
            {{ userData()?.role }}</span
          >
        </div>
        <div class="w-full flex justify-between sm:justify-center sm:gap-5">
          <button
            type="button"
            (click)="clearModal()"
            class="border-2 text-lg sm:text-xl font-semibold py-1 w-[45%] rounded cursor-pointer border-btnporder hover:scale-102 transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            Cancel
          </button>
          <button
            [disabled]="userForm.invalid"
            [class]="{
              'cursor-not-allowed': userForm.invalid,
              'bg-subHeading': userForm.invalid,
              'cursor-pointer': userForm.valid,
              'bg-secondarybg': userForm.valid,
              'hover:scale-102': userForm.valid,
            }"
            class="text-lg sm:text-xl font-semibold text-dark py-1 w-[45%] rounded transition-all duration-custom focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-focusVisibleColor"
          >
            Save
          </button>
        </div>
      </form>
    </div>
  }
</div>
