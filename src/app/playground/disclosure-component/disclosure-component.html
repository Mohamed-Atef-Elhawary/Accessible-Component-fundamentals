<!-- //disclosure.html -->

<div class="grid grid-rows-[auto_1fr_auto] content-between gap-2 h-full">
  <div class="sticky top-0 z-100 lg:h-[80px] overflow-hidden flex items-center">
    <app-header-component [headerData]="headerData" (actionClicked)="saveSettings()" />
  </div>
  <div class="flex flex-col xl:flex-row gap-1">
    <div class="flex-1">
      <app-disclosure-settings-sections-component />
    </div>
    <div class="xl:h-full xl:w-[300px] bg-whiteColor">
      <div class="xl:sticky top-[80px]">
        <app-accessibility-playground-component
          [accessibilityOptions]="accessibilityOptions()"
          (toggleOption)="onToggleOption($event)"
        />
      </div>
    </div>
  </div>
  <div class="">
    <app-activity-log-component />
  </div>
</div>
