<div class="flex flex-col gap-2">
  <div class="">
    <app-header-component [headerData]="headerData" (actionClicked)="saveSettings()" />
  </div>
  <div class="flex flex-col xl:flex-row gap-2 xl:h-[550px]">
    <div class="xl:w-[75%] overflow-y-auto">
      <app-disclosure-settings-sections-component />
    </div>
    <div class="xl:w-[25%]">
      <app-accessibility-playground-component
        [accessibilityOptions]="accessibilityOptions()"
        (toggleOption)="onToggleOption($event)"
      />
    </div>
  </div>
  <div class="">
    <app-activity-log-component />
  </div>
</div>
